spring.application.name=auth-service

# Render provides PORT; 8081 is the local fallback used by the Docker contract.
server.port=${PORT:8081}

# Eureka client configuration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:https://fintrack-eurekaserver.onrender.com/eureka/}}
eureka.instance.prefer-ip-address=true

# PostgreSQL configuration (externalized environment credentials)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fintrack}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=1

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT configuration (externalized environment secret)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Actuator endpoints
management.endpoints.web.exposure.include=health,info

# Gmail SMTP and HTTPS email configuration
fintrack.mail.host=${SMTP_HOST:smtp.gmail.com}
fintrack.mail.port=${SMTP_PORT:587}
fintrack.mail.username=${SMTP_USERNAME:}
fintrack.mail.password=${SMTP_PASSWORD:}
fintrack.mail.from-email=${SMTP_FROM_EMAIL:no-reply@fintrack.com}
fintrack.mail.from-name=${SMTP_FROM_NAME:FinTrack Security}
fintrack.mail.enabled=${SMTP_ENABLED:true}
fintrack.mail.resend-api-key=${RESEND_API_KEY:}
fintrack.mail.brevo-api-key=${BREVO_API_KEY:}
fintrack.mail.google-script-url=${GOOGLE_SCRIPT_MAIL_URL:}
fintrack.mail.auth=true
fintrack.mail.starttls.enable=true
fintrack.mail.starttls.required=true
fintrack.mail.timeout-ms=10000
fintrack.mail.connection-timeout-ms=10000
fintrack.mail.write-timeout-ms=10000

# Frontend and password reset configuration
fintrack.auth.frontend-url=${FRONTEND_URL:https://fintrack-tau-teal.vercel.app}
fintrack.auth.reset-token-ttl-minutes=30
